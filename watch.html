<!DOCTYPE html>
<html>
<head>
<title>Watch</title>
</head>

<body style="background:black;color:white">

<video id="player" controls width="100%"></video>
<h3 id="title"></h3>

<script>
let data = JSON.parse(localStorage.getItem("video"));

document.getElementById("player").src = data.url;
document.getElementById("title").innerText = data.title;
</script>

</body>
</html>
