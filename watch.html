<!DOCTYPE html>
<html>
<head>
<title>Watch</title>
<style>
body{background:#000;color:white;font-family:Arial;margin:0}
video{width:100%}
.title{padding:10px}
</style>
</head>

<body>

<video controls id="player"></video>
<div class="title" id="title"></div>

<script>
let data = JSON.parse(localStorage.getItem("video"));

document.getElementById("player").src = data.url;
document.getElementById("title").innerText = data.title;
</script>

</body>
</html>
