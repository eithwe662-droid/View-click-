<!DOCTYPE html>
<html>
<head>
<title>Upload Video</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
input,button{margin:10px;padding:10px;border-radius:8px;border:none}
button{background:red;color:white}
</style>
</head>

<body>

<h2>📤 Upload Video</h2>

<input type="text" id="title" placeholder="Video Title"><br>
<input type="file" id="file"><br>
<button onclick="upload()">Upload</button>

<script>
// 🔐 admin protect
const ADMIN_UID = "kvtZvLkII8aOI9bcAV0169tDKAc2";
if(localStorage.getItem("uid") !== ADMIN_UID){
  alert("No access");
  location.href="index.html";
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-storage.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyA...",
  authDomain:"viewclick-bea4e.firebaseapp.com",
  projectId:"viewclick-bea4e",
  storageBucket:"viewclick-bea4e.appspot.com"
});

const storage = getStorage(app);
const db = getFirestore(app);

window.upload = async function(){
  let title = document.getElementById("title").value;
  let file = document.getElementById("file").files[0];

  if(!file || !title){
    alert("Fill all!");
    return;
  }

  let refStorage = ref(storage,"videos/"+file.name);
  await uploadBytes(refStorage,file);

  let url = await getDownloadURL(refStorage);

  await addDoc(collection(db,"videos"),{
    title:title,
    url:url,
    time:Date.now()
  });

  alert("Uploaded!");
}
</script>

</body>
</html>
