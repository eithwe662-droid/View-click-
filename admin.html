<!DOCTYPE html>
<html>
<head>
<title>Upload Video</title>
</head>

<body>

<h2>Upload</h2>
<input type="text" id="title" placeholder="Title"><br>
<input type="file" id="file"><br>
<button onclick="upload()">Upload</button>

<script>
// 🔐 Admin UID protect
const ADMIN_UID = "kvtZvLkII8aOI9bcAV0169tDKAc2";
if(localStorage.getItem("uid") !== ADMIN_UID){
  alert("No access");
  location.href="index.html";
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-storage.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// ✅ FULL CONFIG (already added)
const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  storageBucket: "viewclick-bea4e.appspot.com",
  messagingSenderId: "462455920611",
  appId: "1:462455920611:web:f9d55065198faf191cb2d6"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const db = getFirestore(app);

window.upload = async function(){
  let title = document.getElementById("title").value;
  let file = document.getElementById("file").files[0];

  if(!file || !title){
    alert("Fill all!");
    return;
  }

  let storageRef = ref(storage,"videos/"+file.name);

  await uploadBytes(storageRef,file);

  let url = await getDownloadURL(storageRef);

  await addDoc(collection(db,"videos"),{
    title:title,
    url:url
  });

  alert("Uploaded!");
}
</script>

</body>
</html>
