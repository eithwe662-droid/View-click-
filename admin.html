<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
</head>

<body style="text-align:center;font-family:Arial">

<h2>👑 Admin Panel</h2>

<input id="url" placeholder="Video URL"><br><br>
<button onclick="upload()">Upload Video</button>

<h3>Videos</h3>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  storageBucket: "viewclick-bea4e.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.upload = async function(){
  let url = document.getElementById("url").value;

  if(!url){
    alert("Enter video URL");
    return;
  }

  await addDoc(collection(db,"videos"),{
    url:url
  });

  alert("✅ Uploaded!");
  load();
}

async function load(){
  let snap = await getDocs(collection(db,"videos"));
  let list = document.getElementById("list");
  list.innerHTML = "";

  snap.forEach((d)=>{
    let data = d.data();

    let div = document.createElement("div");
    div.innerHTML = `
      ${data.url}
      <button onclick="del('${d.id}')">❌ Delete</button>
    `;

    list.appendChild(div);
  });
}

window.del = async function(id){
  await deleteDoc(doc(db,"videos",id));
  load();
}

load();
</script>

</body>
</html>
