<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
</head>

<body style="text-align:center;font-family:Arial">

<h2>👑 Admin Panel</h2>

<input id="url" placeholder="Video URL"><br><br>
<button onclick="upload()">Upload</button>

<br><br>
<button onclick="logout()">Logout</button>

<h3>Videos</h3>
<div id="list"></div>

<script>
// 🔐 protect admin
const ADMIN_EMAIL = "admin@gmail.com";
let email = localStorage.getItem("email");

if(email !== ADMIN_EMAIL){
  alert("Access Denied!");
  location.href="index.html";
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.upload = async function(){
  let url = document.getElementById("url").value;

  await addDoc(collection(db,"videos"),{url:url});
  alert("Uploaded!");
  load();
}

async function load(){
  let snap = await getDocs(collection(db,"videos"));
  let list = document.getElementById("list");
  list.innerHTML="";

  snap.forEach((d)=>{
    let div=document.createElement("div");
    div.innerHTML=`
      ${d.data().url}
      <button onclick="del('${d.id}')">❌</button>
    `;
    list.appendChild(div);
  });
}

window.del = async function(id){
  await deleteDoc(doc(db,"videos",id));
  load();
}

window.logout = function(){
  localStorage.removeItem("email");
  location.href="index.html";
}

load();
</script>

</body>
</html>
