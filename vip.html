<!DOCTYPE html>
<html>
<head>
  <title>VIP Plans</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    h1 { margin-top: 20px; }

    .card {
      background: #1e2a38;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px #000;
    }

    .vip1 { border: 2px solid #aaa; }
    .vip2 { border: 2px solid #00c3ff; }
    .vip3 { border: 2px solid gold; }
    .vip4 { border: 2px solid red; }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: gold;
      font-weight: bold;
      cursor: pointer;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 80%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>💎 VIP Plans</h1>
<p id="currentVip">Loading...</p>

<div class="card vip1">
  <h2>VIP 1</h2>
  <p>5000 Ks</p>
  <button onclick="selectVIP(1)">Buy</button>
</div>

<div class="card vip2">
  <h2>VIP 2</h2>
  <p>15000 Ks</p>
  <button onclick="selectVIP(2)">Buy</button>
</div>

<div class="card vip3">
  <h2>VIP 3</h2>
  <p>30000 Ks</p>
  <button onclick="selectVIP(3)">Buy</button>
</div>

<div class="card vip4">
  <h2>VIP 4</h2>
  <p>50000 Ks</p>
  <button onclick="selectVIP(4)">Buy</button>
</div>

<h3>📸 Payment Screenshot</h3>
<input type="text" id="proof" placeholder="Paste screenshot link">
<br><br>
<button onclick="submitPayment()">Submit</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// ✅ YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  storageBucket: "viewclick-bea4e.firebasestorage.app",
  messagingSenderId: "462455920611",
  appId: "1:462455920611:web:f9d55065198faf191cb2d6",
  measurementId: "G-MB28RXES41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let currentUser;
let selectedVIP = 0;

// 🔥 Load user
onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUser = user;

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if(!snap.exists()){
      await setDoc(ref, {
        vipLevel: 0,
        pendingVIP: 0,
        paymentProof: ""
      });
    }

    const data = (await getDoc(ref)).data();

    document.getElementById("currentVip").innerText =
      "Current VIP: " + (data.vipLevel || 0);

  } else {
    alert("Please login first");
    window.location.href = "login.html";
  }
});

// 👉 Select VIP
window.selectVIP = function(level){
  selectedVIP = level;
  alert("VIP " + level + " selected");
}

// 👉 Submit Payment
window.submitPayment = async function(){
  const proof = document.getElementById("proof").value;

  if(selectedVIP == 0){
    alert("Select VIP first!");
    return;
  }

  if(proof == ""){
    alert("Enter screenshot link!");
    return;
  }

  const ref = doc(db, "users", currentUser.uid);

  await updateDoc(ref, {
    pendingVIP: selectedVIP,
    paymentProof: proof
  });

  alert("✅ Submitted! Wait for admin approval.");
}
</script>

</body>
</html>
