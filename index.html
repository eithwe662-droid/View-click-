<!DOCTYPE html>
<html>
<head>
  <title>Login - View Click</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      color:white;
      font-family:Arial;
    }
    .box{
      width:300px;
      background:#222;
      padding:20px;
      border-radius:15px;
      text-align:center;
    }
    input,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:8px;
      border:none;
    }
    button{background:orange;color:white;}
  </style>
</head>

<body>

<div class="box">
<h2 id="title">🔐 Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<div id="msg"></div>

<p onclick="toggle()" style="cursor:pointer;">Switch</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "admin@gmail.com";
let isLogin = true;

window.toggle = function(){
  isLogin = !isLogin;
  document.getElementById("title").innerText = isLogin ? "Login" : "Signup";
}

window.login = async function(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  try{
    if(isLogin){
      await signInWithEmailAndPassword(auth,email,password);
    }else{
      let user = await createUserWithEmailAndPassword(auth,email,password);

      await setDoc(doc(db,"users",user.user.uid),{
        balance:0,
        vip:0
      });
    }

    // save email
    localStorage.setItem("email", email);

    // redirect
    if(email === ADMIN_EMAIL){
      location.href="admin.html";
    }else{
      location.href="home.html";
    }

  }catch(e){
    document.getElementById("msg").innerText = e.message;
  }
}
</script>

</body>
</html>
