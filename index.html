<!DOCTYPE html>
<html>
<head>
  <title>Login - Earn App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #141e30, #243b55);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 360px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(30px);}
      to {opacity:1; transform: translateY(0);}
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(45deg, gold, orange);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #msg {
      margin-top: 10px;
      font-size: 14px;
    }

    .switch {
      margin-top: 15px;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="box">
  <h2 id="title">🔐 Login</h2>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>

  <div id="msg"></div>

  <div class="switch" onclick="toggle()">Don't have account? Signup</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  appId: "1:462455920611:web:f9d55065198faf191cb2d6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let isLogin = true;

// 🔁 Toggle Login / Signup
window.toggle = function(){
  isLogin = !isLogin;

  document.getElementById("title").innerText = isLogin ? "🔐 Login" : "🆕 Signup";
  document.querySelector("button").innerText = isLogin ? "Login" : "Signup";
  document.querySelector(".switch").innerText =
    isLogin ? "Don't have account? Signup" : "Already have account? Login";
}

// 🔐 Login / Signup
window.login = async function(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  if(!email || !password){
    msg.style.color = "yellow";
    msg.innerText = "⚠️ Fill all fields";
    return;
  }

  msg.style.color = "white";
  msg.innerText = "⏳ Please wait...";

  try{
    if(isLogin){
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db,"users",userCred.user.uid), {
        vipLevel: 0,
        balance: 0
      });
    }

    msg.style.color = "lightgreen";
    msg.innerText = "✅ Success! Redirecting...";

    setTimeout(()=>{
      window.location.href = "home.html"; // 🔥 important
    },1000);

  }catch(e){
    msg.style.color = "red";
    msg.innerText = "❌ " + e.message;
    console.log(e);
  }
}
</script>

</body>
</html>
