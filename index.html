<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Click Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800">View Click</h1>
    <p class="text-center text-gray-500 mt-2">Beautiful Firebase Login & Signup</p>

    <div class="flex mt-6 bg-gray-100 rounded-2xl p-1">
      <button id="loginTab" class="tabBtn flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Login</button>
      <button id="signupTab" class="tabBtn flex-1 py-2 rounded-xl text-gray-600 font-semibold">Sign Up</button>
    </div>

    <form id="authForm" class="mt-6 space-y-4">
      <input id="name" type="text" placeholder="Full name" class="hidden w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 focus:ring-indigo-400" />
      <input id="email" type="email" placeholder="Email" class="w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 focus:ring-indigo-400" required />
      <input id="password" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 focus:ring-indigo-400" required />
      <button type="submit" id="submitBtn" class="w-full py-3 rounded-2xl bg-indigo-600 text-white font-bold hover:scale-[1.02] transition">Login</button>
    </form>

    <div class="my-5 flex items-center gap-3">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-sm text-gray-400">OR</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <button id="googleLogin" class="w-full border py-3 rounded-2xl font-semibold flex items-center justify-center gap-3 hover:bg-gray-50">
      <span>🔵</span> Continue with Google
    </button>

    <p id="message" class="text-center text-sm mt-4"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-analytics.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
      authDomain: "viewclick-bea4e.firebaseapp.com",
      projectId: "viewclick-bea4e",
      storageBucket: "viewclick-bea4e.firebasestorage.app",
      messagingSenderId: "462455920611",
      appId: "1:462455920611:web:2f4d5d415ad9fa891cb2d6",
      measurementId: "G-17RYLQNSG7"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let isSignup = false;

    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const nameInput = document.getElementById('name');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('authForm');
    const msg = document.getElementById('message');

    function switchMode(signup) {
      isSignup = signup;
      nameInput.classList.toggle('hidden', !signup);
      submitBtn.textContent = signup ? 'Create Account' : 'Login';
      loginTab.className = signup
        ? 'tabBtn flex-1 py-2 rounded-xl text-gray-600 font-semibold'
        : 'tabBtn flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold';
      signupTab.className = signup
        ? 'tabBtn flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold'
        : 'tabBtn flex-1 py-2 rounded-xl text-gray-600 font-semibold';
    }

    loginTab.onclick = () => switchMode(false);
    signupTab.onclick = () => switchMode(true);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = nameInput.value;

      try {
        if (isSignup) {
          const userCred = await createUserWithEmailAndPassword(auth, email, password);
          if (name) await updateProfile(userCred.user, { displayName: name });
          msg.textContent = '✅ Account created successfully';
          msg.className = 'text-green-600 text-center text-sm mt-4';
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          msg.textContent = '✅ Login successful';
          msg.className = 'text-green-600 text-center text-sm mt-4';
        }
      } catch (error) {
        msg.textContent = '❌ ' + error.message;
        msg.className = 'text-red-600 text-center text-sm mt-4';
      }
    });

    document.getElementById('googleLogin').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        msg.textContent = '✅ Google login successful';
        msg.className = 'text-green-600 text-center text-sm mt-4';
      } catch (error) {
        msg.textContent = '❌ ' + error.message;
        msg.className = 'text-red-600 text-center text-sm mt-4';
      }
    });
  </script>
</body>
</html>
