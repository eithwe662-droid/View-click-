<!DOCTYPE html>
<html>
<head>
  <title>Earn App Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    .container {
      padding: 15px;
      padding-bottom: 80px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      color: gold;
    }

    .vip {
      margin-top: 5px;
      opacity: 0.8;
    }

    .earn-btn {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(45deg, gold, orange);
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      box-shadow: 0 5px 20px rgba(255,215,0,0.5);
    }

    .vip-card {
      padding: 15px;
      border-radius: 15px;
      margin-top: 10px;
      background: rgba(0,0,0,0.4);
    }

    .vip-card h3 {
      color: gold;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: space-around;
      padding: 10px;
      backdrop-filter: blur(10px);
    }

    .nav button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
    }

  </style>
</head>

<body>

<header>💰 Earn App Pro</header>

<div class="container">

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="card">
      <div class="balance" id="balance">0 Ks</div>
      <div class="vip" id="vip">VIP 0</div>
    </div>

    <div class="card">
      <button class="earn-btn" onclick="earn()">🎥 Watch & Earn</button>
    </div>
  </div>

  <!-- VIP -->
  <div id="vipPage" style="display:none;">
    <div class="card">
      <h2>💎 VIP Plans</h2>

      <div class="vip-card">
        <h3>VIP 1</h3>
        <p>5000 Ks</p>
        <button onclick="selectVIP(1)">Buy</button>
      </div>

      <div class="vip-card">
        <h3>VIP 2</h3>
        <p>15000 Ks</p>
        <button onclick="selectVIP(2)">Buy</button>
      </div>

      <div class="vip-card">
        <h3>VIP 3</h3>
        <p>30000 Ks</p>
        <button onclick="selectVIP(3)">Buy</button>
      </div>

      <input id="proof" placeholder="Paste Payment Screenshot Link">
      <button class="earn-btn" onclick="submitPayment()">Submit Payment</button>
    </div>
  </div>

</div>

<!-- NAV -->
<div class="nav">
  <button onclick="showPage('dashboard')">🏠 Home</button>
  <button onclick="showPage('vipPage')">💎 VIP</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  storageBucket: "viewclick-bea4e.firebasestorage.app",
  messagingSenderId: "462455920611",
  appId: "1:462455920611:web:f9d55065198faf191cb2d6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let userData = {};
let currentUser;
let selectedVIP = 0;

onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUser = user;

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if(!snap.exists()){
      await setDoc(ref, {
        vipLevel: 0,
        balance: 0,
        pendingVIP: 0
      });
    }

    userData = (await getDoc(ref)).data();
    updateUI();

  } else {
    window.location.href = "login.html";
  }
});

function updateUI(){
  document.getElementById("vip").innerText = "VIP " + userData.vipLevel;
  document.getElementById("balance").innerText = userData.balance + " Ks";
}

window.earn = async function(){
  userData.balance += 100;

  await updateDoc(doc(db,"users",currentUser.uid), {
    balance: userData.balance
  });

  updateUI();
}

window.selectVIP = function(v){
  selectedVIP = v;
  alert("Selected VIP " + v);
}

window.submitPayment = async function(){
  const proof = document.getElementById("proof").value;

  if(selectedVIP == 0){
    alert("Select VIP first!");
    return;
  }

  await updateDoc(doc(db,"users",currentUser.uid), {
    pendingVIP: selectedVIP,
    paymentProof: proof
  });

  alert("Submitted! Wait admin approval");
}

window.showPage = function(page){
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("vipPage").style.display = "none";
  document.getElementById(page).style.display = "block";
}
</script>

</body>
</html>
