<!DOCTYPE html>
<html>
<head>
<title>View Click</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial}
.header{padding:10px;background:#000;font-size:20px}
.video{display:flex;padding:10px;border-bottom:1px solid #333}
.thumb{width:120px;height:70px;background:#444;margin-right:10px}
.title{font-size:14px}
</style>
</head>

<body>

<div class="header">📺 View Click</div>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyA...",
  authDomain:"viewclick-bea4e.firebaseapp.com",
  projectId:"viewclick-bea4e"
});

const db = getFirestore(app);

async function load(){
  let snap = await getDocs(collection(db,"videos"));
  let list = document.getElementById("list");

  snap.forEach(doc=>{
    let d = doc.data();

    let div = document.createElement("div");
    div.className="video";

    div.innerHTML=`
      <div class="thumb"></div>
      <div>
        <div class="title">${d.title}</div>
      </div>
    `;

    div.onclick = ()=>{
      localStorage.setItem("video", JSON.stringify(d));
      location.href="watch.html";
    }

    list.appendChild(div);
  });
}

load();
</script>

</body>
</html>
