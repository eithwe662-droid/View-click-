  <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Click Home</title>

<style>
body{margin:0;background:#111;color:white;font-family:Arial}
.header{text-align:center;padding:10px;background:#1e1e1e}
.video{margin:10px;padding:10px;background:#222;border-radius:10px}
.nav{
 position:fixed;bottom:0;width:100%;
 display:flex;justify-content:space-around;
 background:#1e1e1e;padding:10px;
}
</style>
</head>

<body>

<div class="header">
<h2>🎥 View Click</h2>
<p>💰 Balance: <span id="bal">0</span></p>
</div>

<div id="videos"></div>

<div class="nav">
<div>🏠 Home</div>
<div onclick="location.href='admin.html'">👑 Admin</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  storageBucket: "viewclick-bea4e.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let balance = localStorage.getItem("bal") || 0;
document.getElementById("bal").innerText = balance;

async function loadVideos(){
  let snap = await getDocs(collection(db,"videos"));

  snap.forEach((doc)=>{
    let data = doc.data();

    let div = document.createElement("div");
    div.className="video";

    div.innerHTML = `
      <video width="100%" controls onended="earn(this)">
        <source src="${data.url}">
      </video>
    `;

    document.getElementById("videos").appendChild(div);
  });
}

window.earn = function(v){
  if(!v.dataset.done){
    v.dataset.done = true;
    balance = Number(balance) + 100;

    document.getElementById("bal").innerText = balance;
    localStorage.setItem("bal", balance);

    alert("💰 +100 MMK Earned!");
  }
}

loadVideos();
</script>

</body>
</html>
