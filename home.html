<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body{background:#111;color:white;font-family:Arial;margin:0}
.video{margin:10px;padding:10px;background:#222;border-radius:10px}
</style>
</head>

<body>

<h2 style="text-align:center;">🎥 View Click</h2>
<p style="text-align:center;">💰 Balance: <span id="bal">0</span></p>

<button onclick="logout()">Logout</button>

<div id="videos"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let balance = 0;

async function loadVideos(){
  let snap = await getDocs(collection(db,"videos"));

  snap.forEach((doc)=>{
    let data = doc.data();

    let div = document.createElement("div");
    div.className="video";

    div.innerHTML = `
      <video width="100%" controls onended="earn(this)">
        <source src="${data.url}">
      </video>
    `;

    document.getElementById("videos").appendChild(div);
  });
}

window.earn = function(v){
  if(!v.dataset.done){
    v.dataset.done=true;
    balance+=100;
    document.getElementById("bal").innerText=balance;
    alert("+100 MMK");
  }
}

window.logout = function(){
  localStorage.removeItem("email");
  location.href="index.html";
}

loadVideos();
</script>

</body>
</html>
