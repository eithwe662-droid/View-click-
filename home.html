<!DOCTYPE html>
<html>
<head>
<title>Home</title>
</head>

<body style="background:#111;color:white;font-family:Arial">

<h2>📺 View Click</h2>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  storageBucket: "viewclick-bea4e.appspot.com",
  messagingSenderId: "462455920611",
  appId: "1:462455920611:web:f9d55065198faf191cb2d6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  let snap = await getDocs(collection(db,"videos"));
  let list = document.getElementById("list");

  snap.forEach(doc=>{
    let d = doc.data();

    let div = document.createElement("div");
    div.style.margin="10px";
    div.innerHTML=`
      <p>${d.title}</p>
    `;

    div.onclick = ()=>{
      localStorage.setItem("video", JSON.stringify(d));
      location.href="watch.html";
    }

    list.appendChild(div);
  });
}

load();
</script>

</body>
</html>
