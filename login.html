<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #1d2671, #c33764);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
    }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      color: white;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      background: gold;
      font-weight: bold;
    }

    #msg {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2 id="title">Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <div id="msg"></div>

  <p onclick="toggle()" style="margin-top:10px;cursor:pointer;">
    Don't have account? Signup
  </p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2lwztDpRpACuXirg7T_WbMLqscnNwCdc",
  authDomain: "viewclick-bea4e.firebaseapp.com",
  projectId: "viewclick-bea4e",
  appId: "1:462455920611:web:f9d55065198faf191cb2d6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let isLogin = true;

window.toggle = function(){
  isLogin = !isLogin;
  document.getElementById("title").innerText = isLogin ? "Login" : "Signup";
}

window.login = async function(){
  const email = email.value.trim();
  const password = password.value.trim();
  const msg = document.getElementById("msg");

  if(!email || !password){
    msg.innerText = "Fill all fields";
    return;
  }

  msg.innerText = "Loading...";

  try{
    if(isLogin){
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db,"users",userCred.user.uid), {
        vipLevel: 0,
        balance: 0
      });
    }

    msg.innerText = "Success!";
    setTimeout(()=>{
      window.location.href = "index.html";
    },800);

  }catch(e){
    msg.innerText = e.message;
  }
}
</script>

</body>
</html>
